<head>

                    <br>Te quiero muchoo dear mom!! 🤍🤍💐💐</p>

        </div>
    </div>

    <button class="open-btn" onclick="openLetter()">Leer Carta</button>

    <script src="script.js"></script>
</body>

</html>
